# Copy these into Streamlit Community Cloud: App settings -> Secrets.
ADMIN_PASSWORD = "choose-a-long-password"
# Free Postgres from Neon or Supabase. On Supabase use the "Session pooler" URI (Streamlit Cloud has no IPv6).
DATABASE_URL = "postgresql://USER:PASSWORD@HOST:5432/postgres?sslmode=require"
# Your app's public address; used for the join link and QR code.
APP_URL = "https://your-app-name.streamlit.app"
